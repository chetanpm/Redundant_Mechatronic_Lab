- name: Aerostatic Bearing Spindle
  more_page: "spindle-more"   # carries a second, folded "More information" page (see 5-projects.html)
  details: "The shaft floats on a pressurized air film through a porous graphite layer — no contact, no friction, no wear. Built for ultra-precision machining and metrology. Rig-tested, machining trials complete, exhibited at IMTEX 2025."
  image_thumbnail: "/Redundant_Mechatronic_Lab/assets/img/projects/aerostatic_spindle_imtex_thumb.webp"
  image_expanded: "/Redundant_Mechatronic_Lab/assets/img/projects/aerostatic_spindle_imtex.webp"
  specifications:
    - label: Max Speed
      value: 12,000 RPM (motor)
    - label: Bearing Type
      value: Aerostatic · porous graphite
    - label: Running Accuracy
      value: "< 0.4 µm (400 nm)"
    - label: Positioning
      value: "± 0.5 arcsec"
    - label: Axial Load
      value: 100 kg
    - label: Stiffness (axial / radial)
      value: "300 / 150 N/µm"

