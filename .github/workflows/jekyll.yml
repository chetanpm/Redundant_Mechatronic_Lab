# Build and deploy the site to GitHub Pages.
# Requires: repo Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions" (template: "Jekyll").
#
# Gem updates come from Dependabot (.github/dependabot.yml); every PR is
# guarded by the Checks workflow before anything can reach this deploy.
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the
# run in-progress and latest queued. Do NOT cancel in-progress runs: we want
# production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      # Deploy EXACTLY the committed Gemfile.lock. If the Gemfile and lock
      # ever drift (a local `bundle update` that was never committed), the
      # build fails loudly instead of silently shipping different gems than
      # the ones we tested.
      BUNDLE_FROZEN: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        # Ruby version comes from .ruby-version (3.4).
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # runs 'bundle install' and caches gems automatically
      - name: Report toolchain
        # Makes the exact versions used by THIS deploy visible in the run log.
        run: |
          ruby -v
          bundle exec ruby -r jekyll -e 'puts "jekyll #{Jekyll::VERSION} | kramdown #{Kramdown::VERSION} | liquid #{Liquid::VERSION}"'
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        # --strict turns build warnings into errors, so a gem rollout that
        # starts emitting deprecations does not silently go live.
        # Outputs to the './_site' directory by default.
        run: bundle exec jekyll build --strict --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Site checks
        run: python3 tools/check_site.py _site
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
